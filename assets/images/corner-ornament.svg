    <circle cx="24" cy="24" r="3" fill="url(#goldCornerGrad)" />
    <path d="M 24,18 C 22,21 22,27 24,30 C 26,27 26,21 24,18 Z" fill="url(#goldCornerGrad)" fill-opacity="0.6" stroke="none" />
    <path d="M 18,24 C 21,22 27,22 30,24 C 27,26 21,26 18,24 Z" fill="url(#goldCornerGrad)" fill-opacity="0.6" stroke="none" />
    <!-- Outer tips -->
    <circle cx="6" cy="6" r="1.5" fill="url(#goldCornerGrad)" />
    <circle cx="76" cy="4" r="2" fill="url(#goldCornerGrad)" />
    <circle cx="4" cy="76" r="2" fill="url(#goldCornerGrad)" />
  </g>
</svg>