<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Subtle repeating geometric floral jali pattern -->
  <g fill="none" stroke="#9C8354" stroke-width="0.75" stroke-opacity="0.16">
    <!-- Diamond outer ring with curved corners -->
    <rect x="15" y="15" width="30" height="30" rx="6" transform="rotate(45 30 30)" />
    <!-- Concentric circles in center -->
    <circle cx="30" cy="30" r="14" stroke-width="0.5" stroke-dasharray="2 2" />
    <circle cx="30" cy="30" r="9" />
    <circle cx="30" cy="30" r="3.5" fill="#9C8354" fill-opacity="0.10" />
    <!-- 4-petal floral motif inside circle -->
    <path d="M 30,21 C 28,26 28,26 21,30 C 28,34 28,34 30,39 C 32,34 32,34 39,30 C 32,26 32,26 30,21 Z" fill="#9C8354" fill-opacity="0.08" stroke-width="0.5" />
    <!-- Corner diamonds for seamless tile -->
    <rect x="-15" y="-15" width="30" height="30" rx="6" transform="rotate(45 0 0)" />
    <rect x="45" y="-15" width="30" height="30" rx="6" transform="rotate(45 60 0)" />
    <rect x="-15" y="45" width="30" height="30" rx="6" transform="rotate(45 0 60)" />
    <rect x="45" y="45" width="30" height="30" rx="6" transform="rotate(45 60 60)" />
    <!-- Corner concentric circles -->
    <circle cx="0" cy="0" r="8" />
    <circle cx="60" cy="0" r="8" />
    <circle cx="0" cy="60" r="8" />
    <circle cx="60" cy="60" r="8" />
  </g>
</svg>