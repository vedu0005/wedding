<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="monogramGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3"/>
      <stop offset="25%" stop-color="#DFBA73"/>
      <stop offset="50%" stop-color="#C59B4B"/>
      <stop offset="75%" stop-color="#F3E3B5"/>
      <stop offset="100%" stop-color="#9C7728"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Ornate Diamond Frame -->
  <g stroke="url(#monogramGold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer thin diamond -->
    <rect x="25" y="25" width="150" height="150" rx="20" transform="rotate(45 100 100)" stroke-width="1.2" stroke-opacity="0.8" />
    <!-- Inner dashed border -->
    <rect x="34" y="34" width="132" height="132" rx="14" transform="rotate(45 100 100)" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.6" />
    
    <!-- Four Cardinal Corner Ornaments -->
    <!-- Top Tip -->
    <circle cx="100" cy="12" r="3.5" fill="url(#monogramGold)" />
    <path d="M 94,18 C 97,14 103,14 106,18" stroke-width="1.2"/>
    <path d="M 92,24 C 96,20 104,20 108,24" stroke-width="0.8"/>
    
    <!-- Bottom Tip -->
    <circle cx="100" cy="188" r="3.5" fill="url(#monogramGold)" />
    <path d="M 94,182 C 97,186 103,186 106,182" stroke-width="1.2"/>
    <path d="M 92,176 C 96,180 104,180 108,176" stroke-width="0.8"/>
    
    <!-- Left Tip -->
    <circle cx="12" cy="100" r="3.5" fill="url(#monogramGold)" />
    <path d="M 18,94 C 14,97 14,103 18,106" stroke-width="1.2"/>
    <path d="M 24,92 C 20,96 20,104 24,108" stroke-width="0.8"/>
    
    <!-- Right Tip -->
    <circle cx="188" cy="100" r="3.5" fill="url(#monogramGold)" />
    <path d="M 182,94 C 186,97 186,103 182,106" stroke-width="1.2"/>
    <path d="M 176,92 C 180,96 180,104 176,108" stroke-width="0.8"/>
  </g>

  <!-- Letters: S & D with Heart -->
  <g text-anchor="middle" dominant-baseline="central">
    <!-- Letter S -->
    <text x="70" y="102" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', serif" font-size="52" font-weight="700" fill="url(#monogramGold)" letter-spacing="1">S</text>
    
    <!-- Center Royal Heart with Crown/Flourish -->
    <g transform="translate(100, 100)">
      <path d="M 0,-6 C -2,-13 -12,-13 -12,-4 C -12,4 0,14 0,16 C 0,14 12,4 12,-4 C 12,-13 2,-13 0,-6 Z" fill="#C5283D" stroke="url(#monogramGold)" stroke-width="1.2" />
      <circle cx="0" cy="-6" r="1.5" fill="#FFE8A3" />
    </g>
    
    <!-- Letter D -->
    <text x="130" y="102" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', serif" font-size="52" font-weight="700" fill="url(#monogramGold)" letter-spacing="1">D</text>
  </g>
</svg>